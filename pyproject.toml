[project]
name = "nola-housing"
version = "0.1.0"
description = "Property + market data ETL for Jefferson Parish (Metairie) and Orleans Parish (New Orleans)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.33",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# B608 (hardcoded SQL): every f-string here interpolates static internal
# identifiers (table/column names); actual data values always go through
# parameterized `?` placeholders. Not a real injection vector.
skips = ["B608"]
