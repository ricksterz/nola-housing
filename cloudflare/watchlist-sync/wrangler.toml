# Watchlist sync for nolaatlas.com (see src/index.js). Stores encrypted watchlists in D1; the
# site's /watchlist/ page shows its Sync panel only once this answers /api/sync/health.
#
# First deploy, from this folder (after `npx wrangler login`):
#   npx wrangler d1 create nolaatlas-watchlist-sync     # then put its database_id below
#   npx wrangler d1 migrations apply nolaatlas-watchlist-sync --remote
#   npx wrangler deploy
name = "nolaatlas-watchlist-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [{ pattern = "nolaatlas.com/api/sync/*", zone_name = "nolaatlas.com" }]

[[d1_databases]]
binding = "DB"
database_name = "nolaatlas-watchlist-sync"
database_id = "PUT-THE-ID-FROM-wrangler-d1-create-HERE"
migrations_dir = "migrations"

# Daily, 09:17 UTC: delete lists nobody has synced for 400 days.
[triggers]
crons = ["17 9 * * *"]
