name: Monthly Flood Zone Refresh (FEMA NFHL)

# FEMA flood maps change slowly (new studies, monthly map revisions), so flood zones are refreshed
# on their own monthly schedule rather than inside the daily assessor refresh — hazards.fema.gov is
# also flaky, and a failed pull here should never block parcel data. Runs mid-month at 09:00 UTC,
# well after the 06:00 assessor and market jobs finish; all three update the same database.
# A failed fetch raises before anything is written, so the previous flood zones stay in place.

on:
  schedule:
    - cron: "0 9 12 * *"  # 09:00 UTC on the 12th of each month
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time across all three refresh workflows: each downloads the database, changes
# it and publishes it back, so two running at once would overwrite each other's work.
concurrency:
  group: nola-db
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install duckdb requests

      - name: Download the current database
        run: |
          python -m etl.db_store pull
          cp etl/nola_housing.duckdb "$RUNNER_TEMP/before.duckdb"

      - name: Refresh FEMA flood zones and rebuild the join
        env:
          ASSESSOR_CONTACT: ${{ secrets.ASSESSOR_CONTACT }}
        run: python -m etl.refresh_flood

      - name: Publish the database if it changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m etl.db_store publish --before "$RUNNER_TEMP/before.duckdb" --notes "Flood zone refresh (FEMA NFHL)"
