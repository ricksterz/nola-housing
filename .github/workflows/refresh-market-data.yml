name: Monthly Market Data Refresh (Redfin, Zillow, FRED)

# Same cadence as the Houston job: Redfin and Zillow publish the prior month
# early in the month; the FRED HPI series (quarterly metro, annual parish) and
# the weekly mortgage rate simply pick up whatever new observations exist.
# Independent of the assessor leg, which has its own schedule.

on:
  schedule:
    - cron: "0 6 5 * *"  # 06:00 UTC on the 5th of each month
  workflow_dispatch:
    inputs:
      only:
        description: "Limit to one source (redfin | zillow | fred | costs); blank = all"
        required: false
        default: ""

permissions:
  contents: write

# One refresh at a time across all three refresh workflows: each downloads the database, changes
# it and publishes it back, so two running at once would overwrite each other's work.
concurrency:
  group: nola-db
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install duckdb requests

      - name: Download the current database
        run: |
          python -m etl.db_store pull
          cp etl/nola_housing.duckdb "$RUNNER_TEMP/before.duckdb"

      - name: Refresh Redfin / Zillow / FRED / ownership costs and rebuild the join
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python -m etl.refresh_market_data --only "$ONLY"
          else
            python -m etl.refresh_market_data
          fi

      - name: Publish the database if it changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          case "$ONLY" in
            "") sources="Redfin, Zillow, FRED, ownership costs" ;;
            redfin) sources="Redfin" ;;
            zillow) sources="Zillow" ;;
            fred) sources="FRED" ;;
            costs) sources="ownership costs" ;;
            *) sources="$ONLY" ;;
          esac
          python -m etl.db_store publish --before "$RUNNER_TEMP/before.duckdb" --notes "Market data refresh ($sources)"
