name: Deploy to GitHub Pages

# Builds the static site (frontend + exported JSON) and deploys it to GitHub
# Pages. Enable in repo Settings → Pages → Source: "GitHub Actions". Runs on
# every push to main and after each data-refresh workflow succeeds, since the
# refreshes publish the database to the `data` release rather than pushing.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Monthly Market Data Refresh (Redfin, Zillow, FRED)"
      - "Assessor Refresh (Jefferson annual, Orleans open rolls)"
      - "Monthly Flood Zone Refresh (FEMA NFHL)"
      - "Address Points Refresh (City of New Orleans)"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install duckdb requests pillow
      # DejaVu fonts for the link-preview images (etl/og_images.py).
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Download the database from the data release
        run: python -m etl.db_store pull
      - name: Export static data from the DuckDB snapshot
        run: python -m etl.export_static
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_STATIC_DATA: "true"
          # Root-relative asset paths: pages live at nested paths ("/ownership/70130/"), which
          # relative paths would resolve under. The github.io project path redirects to the domain.
          VITE_BASE: "/"
          # Google Analytics usage counts (frontend/src/lib/metrics.js); blank = off. The repo
          # variable GA_MEASUREMENT_ID holds the GA4 property's measurement ID (G-...).
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      # A real HTML page per tab and area (title, numbers, links) for search engines, and the
      # sitemap of them; the app takes over when it loads (etl/prerender.py).
      - name: Pre-build pages for search engines
        run: python -m etl.prerender
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
