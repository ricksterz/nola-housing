name: Assessor Refresh (Jefferson annual, Orleans open rolls)

# Cadence follows the parishes' assessment calendars, not the market feeds:
#   Orleans    rolls open Jul 15 – Aug 15 (statutory exception). Daily runs
#              across the window capture the preliminary values at open and the
#              final values after close.
#   Jefferson  annual. Rolls are open for inspection Aug 15 – Sep 15 and
#              certified after; daily runs Aug 15 – Sep 30.
# Each run first probes the official bulk options; only if none answers does
# it batch-pull the public search UI under the per-run request budget
# (ASSESSOR_MAX_REQUESTS_PER_RUN, ~3 s apart). Progress is checkpointed in
# the database, so the daily runs resume where the previous one stopped.

on:
  schedule:
    - cron: "0 6 15-31 7 *"  # Orleans window opens Jul 15
    - cron: "0 6 1-20 8 *"   # Orleans window closes Aug 15 (+5 days for final values)
    - cron: "0 6 15-31 8 *"  # Jefferson inspection period opens Aug 15
    - cron: "0 6 1-30 9 *"   # Jefferson certification
    # Orleans, weekly all year: the City's ParcelSearch layer (owners, tax bills, condo units) has
    # been down since late Sep 2026. Until it answers, Orleans stays on the data.nola.gov land map;
    # the first run after it recovers replaces that with the full records, with nobody watching.
    - cron: "0 7 * * 1"      # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      parish:
        description: "Parish to refresh (jefferson | orleans | both)"
        required: false
        default: "both"
      tax_year:
        description: "Roll year to tag the pull with (default: current year)"
        required: false
        default: ""
      max_records:
        description: "Cap records per parish (smoke test); blank = no cap"
        required: false
        default: ""
      continuation:
        description: "Set by a run that ran out of time and started this one to finish it"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write  # a run that runs out of time dispatches the run that finishes it

# One refresh at a time across all three refresh workflows: each downloads the database, changes
# it and publishes it back, so two running at once would overwrite each other's work.
concurrency:
  group: nola-db
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install duckdb requests

      - name: Download the current database
        run: |
          python -m etl.db_store pull
          cp etl/nola_housing.duckdb "$RUNNER_TEMP/before.duckdb"

      - name: Restore raw landing zone (HTML/JSON payloads from earlier runs)
        uses: actions/cache/restore@v6
        with:
          path: etl/raw
          key: assessor-raw-${{ github.run_id }}
          restore-keys: assessor-raw-

      - name: Report official bulk options
        env:
          ASSESSOR_CONTACT: ${{ secrets.ASSESSOR_CONTACT }}
        run: python -m etl.probe_assessor_bulk

      # Stops short of the job limit so the pages fetched so far are still saved below; the
      # Orleans pull reuses a recent page instead of querying it again (config "resume_hours").
      - name: Refresh assessor data and rebuild the join
        id: refresh
        timeout-minutes: 320
        env:
          ASSESSOR_CONTACT: ${{ secrets.ASSESSOR_CONTACT }}
          ASSESSOR_SEED_FILE: ${{ vars.ASSESSOR_SEED_FILE }}
          ASSESSOR_MAX_REQUESTS_PER_RUN: ${{ vars.ASSESSOR_MAX_REQUESTS_PER_RUN || '5000' }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          PARISH: ${{ github.event.inputs.parish }}
          TAX_YEAR: ${{ github.event.inputs.tax_year }}
          MAX_RECORDS: ${{ github.event.inputs.max_records }}
        run: |
          ARGS=""
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "0 7 * * 1" ]; then
            ARGS="--parish orleans"
          elif [ "$EVENT" = "schedule" ]; then
            ARGS="--auto"
          elif [ "$PARISH" != "both" ] && [ -n "$PARISH" ]; then
            ARGS="--parish $PARISH"
          fi
          [ -n "$TAX_YEAR" ] && ARGS="$ARGS --tax-year $TAX_YEAR"
          [ -n "$MAX_RECORDS" ] && ARGS="$ARGS --max-records $MAX_RECORDS"
          python -m etl.refresh_assessor $ARGS

      - name: Publish the database if it changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARISH: ${{ github.event.schedule == '0 7 * * 1' && 'orleans weekly' || github.event_name == 'schedule' && 'scheduled' || github.event.inputs.parish }}
        run: python -m etl.db_store publish --before "$RUNNER_TEMP/before.duckdb" --notes "Assessor refresh ($PARISH)"

      - name: Save raw landing zone (also when the pull ran out of time)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: etl/raw
          key: assessor-raw-${{ github.run_id }}-${{ github.run_attempt }}

      # A pull that ran out of time is finished by a fresh run that reuses the pages saved above,
      # at most twice in a row so a server that never answers can't chain runs forever.
      - name: Start a run to finish the pull
        if: failure() && steps.refresh.outcome == 'failure' && fromJSON(github.event.inputs.continuation || '0') < 2
        env:
          GH_TOKEN: ${{ github.token }}
          PARISH: ${{ github.event.schedule == '0 7 * * 1' && 'orleans' || github.event.inputs.parish || 'both' }}
          CONTINUATION: ${{ github.event.inputs.continuation || '0' }}
        run: |
          # Only a pull that was getting somewhere: pages landed during this run.
          if ! find etl/raw -name 'arcgis_page_*.json' -mmin -360 2>/dev/null | grep -q .; then
            echo "No pages were fetched this run; nothing to resume."
            exit 0
          fi
          NEXT=$((CONTINUATION + 1))
          gh workflow run refresh-assessor.yml --ref "$GITHUB_REF_NAME" \
            -f parish="$PARISH" -f continuation="$NEXT"
          echo "::notice::Started continuation run $NEXT for $PARISH"

