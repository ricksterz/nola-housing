<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Stop iOS Safari's data detectors from wrapping addresses and number runs (parcel IDs look
         like phone numbers) in links: that rewrites text React owns, and the next update throws
         "NotFoundError: The object can not be found here." -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <title>NOLA Atlas — Every address in New Orleans and Metairie, explained</title>
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("theme") ||
          (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta name="description" content="Flood risk, the true monthly cost, how an assessment compares, and the market around it, for every parcel in Jefferson and Orleans Parish. Free, independent, and built on public records." />
    <link rel="canonical" href="https://nolaatlas.com/" />
    <!-- Link previews (iMessage, Slack, social) -->
    <meta property="og:site_name" content="NOLA Atlas" />
    <meta property="og:title" content="NOLA Atlas — Every address in New Orleans and Metairie, explained" />
    <meta property="og:description" content="Flood risk, the true monthly cost, how an assessment compares, and the market around it, for every parcel in Jefferson and Orleans Parish. Free, independent, and built on public records." />
    <meta property="og:url" content="https://nolaatlas.com/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
