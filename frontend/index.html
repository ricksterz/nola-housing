<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOLA Housing Pulse — New Orleans &amp; Metairie Home Values &amp; Market Trends</title>
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("theme") ||
          (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta
      name="description"
      content="Free home value trends, rents, market velocity and parcel records for Metairie, Old Metairie and New Orleans — every ZIP in Jefferson and Orleans Parish, built on Redfin, Zillow, FRED and assessor data."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
